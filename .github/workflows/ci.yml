name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test test/specifiers.test.js test/lockfile.test.js test/analyze.test.js test/cli.test.js
      - name: Smoke test CLI
        run: node bin/cli.js scan test/fixtures/basic --json --no-color
